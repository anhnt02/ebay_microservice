services:
  api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: paymentshipping-api
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=Server=sqlserver;Database=PaymentShippingDb;User Id=sa;Password=Your_password123;TrustServerCertificate=True
      - Email__Host=mailhog
      - Email__Port=1025
    depends_on:
      - sqlserver
      - mailhog
    networks:
      - payment-network

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: paymentshipping-sql
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Your_password123
    networks:
      - payment-network

  mailhog:
    image: mailhog/mailhog
    container_name: paymentshipping-mailhog
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - payment-network

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    container_name: paymentshipping-frontend
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - payment-network

networks:
  payment-network:
    driver: bridge
